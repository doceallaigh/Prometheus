experiment:
  run_name: rrs-j-cfc-ablate-gru
  seed: 1337
  device: auto
  output_dir: outputs

data:
  dataset_type: reasoning_chain
  sequence_length: 96
  batch_size: 64
  train_split: 0.98
  chain_length_min: 2
  chain_length_max: 8
  num_problems: 50000
  reasoning_seed: 1234
  reasoning_format: mixed

model:
  vocab_size: auto
  embedding_dim: 256
  num_heads: 8
  num_layers: 8
  dropout: 0.1
  architecture: rrs_j_cfc
  base_checkpoint: outputs/rrs-base-cot-20260710-035418/checkpoint.pt
  jspace_layer_index: 6
  cfc_dim: 256
  cfc_max_steps: 64
  cfc_cell_type: gru

training:
  max_steps: 4000
  eval_interval: 250
  log_interval: 50
  learning_rate: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 0

evaluation:
  max_batches: 4
