experiment:
  run_name: smoke-tiny
  seed: 7
  device: auto
  output_dir: outputs

data:
  dataset_type: synthetic
  sequence_length: 64
  batch_size: 8
  train_split: 0.9
  synthetic_repeats: 120

model:
  vocab_size: auto
  embedding_dim: 96
  num_heads: 4
  num_layers: 3
  dropout: 0.1
  mlp_ratio: 4

training:
  max_steps: 20
  eval_interval: 10
  log_interval: 5
  learning_rate: 0.0005
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 5

evaluation:
  max_batches: 4
