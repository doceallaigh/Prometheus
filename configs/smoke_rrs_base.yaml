experiment:
  run_name: smoke-rrs-base
  seed: 1337
  device: cpu
  output_dir: outputs

data:
  dataset_type: reasoning_chain
  sequence_length: 64
  batch_size: 16
  train_split: 0.95
  chain_length_min: 2
  chain_length_max: 4
  num_problems: 500
  reasoning_seed: 1234
  reasoning_format: mixed

model:
  vocab_size: auto
  embedding_dim: 64
  num_heads: 4
  num_layers: 4
  dropout: 0.1
  architecture: dense

training:
  max_steps: 30
  eval_interval: 15
  log_interval: 10
  learning_rate: 0.0003
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 5

evaluation:
  max_batches: 2
