[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-research"
version = "0.1.0"
description = "Baseline experiment stack for the Prometheus research repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "torch>=2.3",
]

[project.scripts]
prometheus = "prometheus.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
